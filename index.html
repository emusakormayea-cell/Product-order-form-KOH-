<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   
  <form id="orderForm">
     <h1>Kerr Omar Honey Order</h1>
    <label>
      Customer Name:
      <input type="text" id="name" required>
    </label>
    
    <label>
      Phone Number:
      <input type="tel" id="phone" required>
    </label>
    
    <label>
      Product Size:
      <select id="size" required>
        <option value="small">350ml Jar (GMD 350)</option>
        <option value="large">1Litre Jar (GMD 850)</option>
      </select>
    </label>
    
    <label>
      Quantity:
      <input type="number" id="quantity" min="1" value="1" required>
    </label>
    
    <label>
      Order Type:
      <select id="orderType" required>
        <option value="pickup">Pickup</option>
        <option value="delivery">Delivery</option>
      </select>
    </label>
    
    <div id="rules"></div>
    
    <div class="total" id="totalAmount">Total: GMD 0</div>
    
    <button type="submit">Submit Order</button>
  </form>
  
  <div id="confirmation"></div>
  
  <script>
    const prices = { small: 350, large: 850 };
    const deliveryFee = 50;
    
    function calculateTotal() {
      const size = document.getElementById('size').value;
      const quantity = parseInt(document.getElementById('quantity').value) || 0;
      const orderType = document.getElementById('orderType').value;
      
      let total = quantity * prices[size];
      if (orderType === 'delivery') total += deliveryFee;
      
      document.getElementById('totalAmount').textContent = "Total: GMD " + total;
      return total;
    }
    
    document.getElementById('size').addEventListener('change', calculateTotal);
    document.getElementById('quantity').addEventListener('input', calculateTotal);
    document.getElementById('orderType').addEventListener('change', () => {
      calculateTotal();
      const rulesDiv = document.getElementById('rules');
      if (document.getElementById('orderType').value === 'pickup') {
        rulesDiv.textContent = "Pickup available 4 PM – 7 PM on Monday, Tuesday, Thursday & Friday. 10 AM - 3PM on Saturday";
      } else {
        rulesDiv.textContent = "Delivery must be scheduled the day before, available until 7 PM.";
      }
    });
    
    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const size = document.getElementById('size').value;
      const quantity = document.getElementById('quantity').value;
      const orderType = document.getElementById('orderType').value;
      const total = calculateTotal();

    // 🔗 Send order data to Google Apps Script Web App
  fetch("https://script.google.com/macros/s/AKfycbxxlc84Ef8QgCuJF41HGD4f7gztC_uCbOvIihfQhvlRQPzzDlQufCgPwPTwi90Zck5t/exec", {
    method: "POST",
    body: JSON.stringify({
      name: name,
      phone: phone,
      size: size,
      quantity: quantity,
      orderType: orderType,
      total: total
    })
  })

      // 3. Show confirmation message (AFTER fetch succeeds)
    let message = `Thank you, ${name}! Your order for ${quantity} ${size} jar(s) is received. `;
    message += (orderType === 'pickup')
      ? "Pickup between 4 PM – 7 PM on Mon, Tue, Thu & Fri; 10 AM – 3 PM on Sat."
      : "Delivery scheduled tomorrow before 7 PM.";
    message += ` Total cost: GMD ${total}.`;

    document.getElementById('confirmation').textContent = message;
  })
  .catch(err => {
    console.error("Error sending order:", err);
    document.getElementById('confirmation').textContent =
      "Error submitting order. Please try again.";
  });

  .then(res => res.text())
  .then(text => {
    console.log("Response from Google Apps Script:", text);
    document.getElementById('confirmation').textContent =
      `Thank you, ${name}! Your order for ${quantity} ${size} jar(s) is received. ` +
      (orderType === 'pickup'
        ? "Pickup between 4 PM – 7 PM on Mon, Tue, Thu & Fri; 10 AM – 3 PM on Sat."
        : "Delivery scheduled tomorrow before 7 PM.") +
      ` Total cost: GMD ${total}.`;
  })
  .catch(err => {
    console.error("Error sending order:", err);
    document.getElementById('confirmation').textContent =
      "Error submitting order. Please try again.";
  });
});
    
    calculateTotal(); // initialize
  </script>
</body>
</html>
